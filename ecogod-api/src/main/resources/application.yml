spring:
  application:
    name: ecogod
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/ecogod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: ${LOCAL_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${LOCAL_JPA_DDL_AUTO:update}
    open-in-view: false
  mail:
    host: ${LOCAL_MAIL_HOST:localhost}
    port: ${LOCAL_MAIL_PORT:1025}
    username: ${LOCAL_MAIL_USERNAME:}
    password: ${LOCAL_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${LOCAL_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${LOCAL_MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:10MB}

app:
  mail:
    from: ${LOCAL_MAIL_FROM:no-reply@ecogod.com}
    inquiry-to: ${LOCAL_INQUIRY_ALERT_TO:admin@ecogod.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    jwt:
      header: Authorization
      secret: ${JWT_SECRET:local-ecogod-admin-jwt-secret-key-2026-secure}
      access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:43200}
  storage:
    s3:
      region: ${APP_S3_REGION:ap-northeast-2}
      bucket: ${APP_S3_BUCKET:}
      public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
      product-image-prefix: ${APP_S3_PRODUCT_IMAGE_PREFIX:products}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
