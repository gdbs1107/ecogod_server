name: develop-cd

on:
  push:
    branches: ["develop"]

concurrency:
  group: develop-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v3

      - name: gradlew 권한 설정
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 배포 스크립트 문법 검증
        run: bash -n deploy/ec2/ssm_deploy.sh

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Jib 이미지 빌드 및 푸시
        env:
          DOCKER_REPO: ${{ secrets.DOCKERHUB_REPO }}
          IMAGE_SHA: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./gradlew :ecogad-api:jib -x test --no-daemon --build-cache \
            -Djib.from.auth.username="${DOCKER_USERNAME}" \
            -Djib.from.auth.password="${DOCKER_PASSWORD}" \
            -Djib.to.image="${DOCKER_REPO}" \
            -Djib.to.tags="${IMAGE_SHA},develop-latest" \
            -Djib.to.auth.username="${DOCKER_USERNAME}" \
            -Djib.to.auth.password="${DOCKER_PASSWORD}"

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SSM 배포 명령 전송
        id: send-command
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DOCKER_REPO: ${{ secrets.DOCKERHUB_REPO }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SCRIPT_B64="$(base64 -w 0 deploy/ec2/ssm_deploy.sh)"

          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "mkdir -p /opt/ecogod",
              "echo ${SCRIPT_B64} | base64 -d > /opt/ecogod/deploy.sh",
              "chmod +x /opt/ecogod/deploy.sh",
              "APP_NAME=ecogod AWS_REGION=${AWS_REGION} DOCKER_REPO=${DOCKER_REPO} IMAGE_TAG=${IMAGE_TAG} DOCKER_USERNAME=${DOCKER_USERNAME} DOCKER_PASSWORD=${DOCKER_PASSWORD} /opt/ecogod/deploy.sh"
            ]
          }
          EOF

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "ecogod develop deploy ${GITHUB_SHA}" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"

      - name: SSM 배포 완료 대기
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)"

            echo "Attempt ${attempt}: ${STATUS}"

            case "${STATUS}" in
              Success)
                exit 0
                ;;
              Cancelled|Cancelling|TimedOut|Failed)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "[ERROR] SSM 배포 대기 시간이 초과되었습니다."
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
            --output json
          exit 1

      - name: 외부 헬스체크
        run: |
          curl -fsS --retry 12 --retry-delay 5 https://api.ecogod.kr/actuator/health
