plugins {
    id 'org.springframework.boot'
    id 'com.google.cloud.tools.jib'
}

dependencies {
    implementation project(':ecogad-domain')
    implementation project(':ecogad-common')
    implementation project(':ecogad-infra')
    implementation project(':ecogad-auth')
    implementation project(':ecogad-external')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    layered {
        enabled = true
    }
}

jib {
    from {
        image = 'eclipse-temurin:17-jre'
    }

    container {
        mainClass = 'or.ecogad.ecogad.EcogadApplication'
        ports = ['8080']
        user = '1000:1000'
        workingDirectory = '/tmp'
    }
}
