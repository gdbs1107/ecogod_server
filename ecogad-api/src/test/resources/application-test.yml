spring:
  datasource:
    url: jdbc:h2:mem:ecogad-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 1025
    username:
    password:

app:
  mail:
    from: no-reply@ecogad.com
    inquiry-to: admin@ecogad.com
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  auth:
    jwt:
      header: Authorization
      secret: test-ecogad-admin-jwt-secret-key-2026-secure
      access-token-validity-in-seconds: 3600

management:
  health:
    mail:
      enabled: false
