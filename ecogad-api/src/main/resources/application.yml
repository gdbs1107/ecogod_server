spring:
  application:
    name: ecogad
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/ecogad?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${LOCAL_JPA_DDL_AUTO:update}
    open-in-view: false
  mail:
    host: ${LOCAL_MAIL_HOST:localhost}
    port: ${LOCAL_MAIL_PORT:1025}
    username: ${LOCAL_MAIL_USERNAME:}
    password: ${LOCAL_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${LOCAL_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${LOCAL_MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${LOCAL_MAIL_FROM:no-reply@ecogad.com}
    inquiry-to: ${LOCAL_INQUIRY_ALERT_TO:admin@ecogad.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
